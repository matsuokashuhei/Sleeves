name: Terraform (Cloudflare)

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan (main branch only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-cloudflare
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      R2_STATE_BUCKET: ${{ secrets.R2_STATE_BUCKET }}
      TF_IMAGE: hashicorp/terraform:1.17.2
    steps:
      - uses: actions/checkout@v7

      - name: Check backend and provider credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$TF_VAR_zone_id" ] && [ -n "$R2_STATE_BUCKET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform fmt check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/cloudflare:/workspace" \
            -w /workspace \
            "$TF_IMAGE" fmt -check -recursive

      - name: Terraform validate (without backend)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/cloudflare:/workspace" \
            -w /workspace \
            "$TF_IMAGE" init -backend=false
          docker run --rm \
            -v "${{ github.workspace }}/infra/cloudflare:/workspace" \
            -w /workspace \
            "$TF_IMAGE" validate

      - name: Write R2 backend config
        if: ${{ steps.creds.outputs.ready == 'true' }}
        run: |
          cat <<EOF > infra/cloudflare/backend.hcl
          bucket = "${R2_STATE_BUCKET}"
          endpoints = {
            s3 = "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          }
          EOF

      - name: Terraform init & plan
        if: ${{ steps.creds.outputs.ready == 'true' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/cloudflare:/workspace" \
            -w /workspace \
            -e CLOUDFLARE_API_TOKEN \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e TF_VAR_zone_id \
            "$TF_IMAGE" init -reconfigure -backend-config=backend.hcl
          docker run --rm \
            -v "${{ github.workspace }}/infra/cloudflare:/workspace" \
            -w /workspace \
            -e CLOUDFLARE_API_TOKEN \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e TF_VAR_zone_id \
            "$TF_IMAGE" plan -out=tfplan -no-color

      - name: Fail if apply requested without credentials or outside main
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && (steps.creds.outputs.ready != 'true' || github.ref != 'refs/heads/main') }}
        run: |
          echo "terraform apply requires refs/heads/main and all Cloudflare/R2 secrets to be configured." >&2
          exit 1

      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && github.ref == 'refs/heads/main' && steps.creds.outputs.ready == 'true' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/cloudflare:/workspace" \
            -w /workspace \
            -e CLOUDFLARE_API_TOKEN \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e TF_VAR_zone_id \
            "$TF_IMAGE" apply -no-color tfplan
