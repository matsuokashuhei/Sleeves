name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/site/**"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/site/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine target Pages branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch=preview-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy static site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/web/site
            --project-name=sleeves-web
            --branch=${{ steps.target.outputs.branch }}
            --commit-dirty=true
